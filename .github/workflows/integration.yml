name: GitHub App Integration Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: AbdullahMohsinU
          repositories: python-hidden-tests

      - name: Check GitHub App access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Checking GitHub App access..."
          gh api /installation/repositories \
            --jq '.repositories[].full_name'

      - name: Check private repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Checking python-hidden-tests..."
          gh api repos/AbdullahMohsinU/python-hidden-tests \
            --jq '.full_name'

      - name: Integration successful
        run: |
          echo "GitHub App integration is working!"
