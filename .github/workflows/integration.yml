name: GitHub App Integration Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout github-demo
        uses: actions/checkout@v4

      - name: Check GitHub App access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_APP_TOKEN }}
        run: |
          echo "Checking GitHub App access..."
          gh api /installation/repositories \
            --jq '.repositories[].full_name'

      - name: Check private repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_APP_TOKEN }}
        run: |
          echo "Checking python-hidden-tests..."
          gh api repos/AbdullahMohsinU/python-hidden-tests \
            --jq '.full_name'

      - name: Integration successful
        run: |
          echo "GitHub App integration is working!"
