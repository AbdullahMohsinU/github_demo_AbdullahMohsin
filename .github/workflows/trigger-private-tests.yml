name: Trigger Private Tests

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 4525745
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: AbdullahMohsinU
          repositories: github_demo_AbdullahMohsin,python-hidden-tests

      - name: Create pending check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            repos/AbdullahMohsinU/github_demo_AbdullahMohsin/check-runs \
            --method POST \
            -f name="Private Hidden Tests" \
            -f head_sha="${{ github.event.pull_request.head.sha }}" \
            -f status="in_progress" \
            -f 'output[title]=Private Hidden Tests' \
            -f 'output[summary]=Waiting for private tests to finish.'

      - name: Trigger private tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            repos/AbdullahMohsinU/python-hidden-tests/dispatches \
            --method POST \
            -f event_type=run-private-tests \
            -f 'client_payload[pr_number]=${{ github.event.pull_request.number }}' \
            -f 'client_payload[sha]=${{ github.event.pull_request.head.sha }}'
